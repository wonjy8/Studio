services:
  studio:
    container_name: studio
    image: ghcr.io/wonjy8/studio:latest
    restart: unless-stopped
    pull_policy: always
    environment:
      APP_ORIGIN: https://studio.wonjongyou.com
      DATA_DIR: /data
      BIBLE_GITHUB_TOKEN: ${BIBLE_GITHUB_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - studio-data:/data
    expose:
      - "8080"
    networks:
      - tunnel
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
volumes:
  studio-data:
    name: studio-data
networks:
  tunnel:
    external: true
    name: ${STUDIO_NETWORK:?Set STUDIO_NETWORK to the existing cloudflared Docker network}

